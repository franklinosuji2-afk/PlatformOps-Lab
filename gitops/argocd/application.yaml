apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/franklinosuji2-afk/PlatformOps-Lab.git
    targetRevision: main
    path: kubernetes/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: platformops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
