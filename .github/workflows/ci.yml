name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Render Kustomize base and overlay
        run: |
          kubectl kustomize kubernetes/base > /dev/null
          kubectl kustomize kubernetes/overlays/local > /dev/null

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build-and-scan:
    runs-on: ubuntu-latest
    needs: validate
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build api frontend

      # Trivy runs from its container image. It reports HIGH and CRITICAL findings
      # in the job summary and does not fail the build yet.
      - name: Trivy scan (config and images)
        run: |
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work ghcr.io/aquasecurity/trivy:0.58.0"
          {
            echo "### Trivy: Kubernetes, Terraform and Docker configuration"
            echo '```'
            $TRIVY config --severity HIGH,CRITICAL --exit-code 0 /work
            echo '```'
            echo "### Trivy: images"
            echo '```'
            $TRIVY image --severity HIGH,CRITICAL --exit-code 0 platformops-lab-api:latest
            $TRIVY image --severity HIGH,CRITICAL --exit-code 0 platformops-lab-frontend:latest
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Snyk only runs when a SNYK_TOKEN repository secret exists.
      - name: Snyk dependency test (backend)
        if: ${{ env.SNYK_TOKEN != '' }}
        working-directory: app/backend
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx --yes snyk@1 test --severity-threshold=high
