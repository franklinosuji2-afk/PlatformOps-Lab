apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local Kind overlay: same manifests as base, one replica each to keep the cluster light.
resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: platformops-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: platformops-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
