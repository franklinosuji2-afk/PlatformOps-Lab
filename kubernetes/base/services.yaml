apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: platformops
spec:
  selector:
    app: platformops-api
  ports:
  - port: 3000
    targetPort: 3000


---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: platformops
spec:
  selector:
    app: platformops-frontend
  ports:
  - port: 80
    targetPort: 80
